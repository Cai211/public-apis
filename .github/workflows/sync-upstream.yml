name: Sync upstream

on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync master branch from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=master
